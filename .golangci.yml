version: "2"

run:
  timeout: 5m
  tests: true
  relative-path-mode: gomod

linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        orm:
          files:
            - "**/internal/service/**"
            - "**/internal/http/**"
            - "**/internal/platform/**"
            - "**/internal/utils/**"
            - "**/internal/domain/**"
            - "**/internal/workers/**"
            - "!$test"
          deny:
            - pkg: gorm.io/gorm
              desc: "the database is reachable only through internal/repository; services take repositories, never *gorm.DB"
  exclusions:
    generated: strict

formatters:
  enable:
    - gofmt
    - goimports
    - golines
  settings:
    golines:
      max-len: 160
      tab-len: 8
      shorten-comments: false
      reformat-tags: false
  exclusions:
    generated: strict
