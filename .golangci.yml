version: "2"

run:
  timeout: 5m
  tests: true
  relative-path-mode: gomod

linters:
  default: standard
  enable:
    - depguard
  # The layering below is the architecture, enforced rather than reviewed. Each
  # package names what it must never import; test files are exempt, because an
  # external test package legitimately reaches across the boundary it verifies.
  settings:
    depguard:
      rules:
        orm:
          # The database is reachable only through internal/repository. bootstrap opens
          # the handle and migrations own the schema, so both keep it; nothing else has
          # any business holding one. Test files are exempt, because a fixture builds
          # its own database before there is a repository to build it with.
          files:
            - "**/internal/service/**"
            - "**/internal/http/**"
            - "**/internal/platform/**"
            - "**/internal/utils/**"
            - "**/internal/domain/**"
            - "**/internal/workers/**"
            - "!$test"
          deny:
            - pkg: gorm.io/gorm
              desc: "the database is reachable only through internal/repository; a service takes repositories, never a *gorm.DB"
        utils:
          files:
            - "**/internal/utils/**"
            - "!$test"
          deny:
            - pkg: github.com/momobasehq/momobase/internal/service/audit
              desc: "internal/utils is a leaf holding pure helpers, so it takes no internal dependency"
            - pkg: github.com/momobasehq/momobase/internal/domain
              desc: "internal/utils is a leaf holding pure helpers, so it takes no internal dependency"
            - pkg: github.com/momobasehq/momobase/internal/service/provider
              desc: "internal/utils is a leaf holding pure helpers, so it takes no internal dependency"
            - pkg: github.com/momobasehq/momobase/internal/service/routing
              desc: "internal/utils is a leaf holding pure helpers, so it takes no internal dependency"
            - pkg: github.com/momobasehq/momobase/internal/service/payment
              desc: "internal/utils is a leaf holding pure helpers, so it takes no internal dependency"
            - pkg: github.com/momobasehq/momobase/internal/service/webhook
              desc: "internal/utils is a leaf holding pure helpers, so it takes no internal dependency"
            - pkg: github.com/momobasehq/momobase/internal/service/reconciliation
              desc: "internal/utils is a leaf holding pure helpers, so it takes no internal dependency"
            - pkg: github.com/momobasehq/momobase/internal/service/identity
              desc: "internal/utils is a leaf holding pure helpers, so it takes no internal dependency"
            - pkg: github.com/momobasehq/momobase/internal/http
              desc: "internal/utils is a leaf holding pure helpers, so it takes no internal dependency"
            - pkg: github.com/momobasehq/momobase/internal/bootstrap
              desc: "internal/utils is a leaf holding pure helpers, so it takes no internal dependency"
            - pkg: github.com/momobasehq/momobase/internal/workers
              desc: "internal/utils is a leaf holding pure helpers, so it takes no internal dependency"
            - pkg: github.com/momobasehq/momobase/internal/platform
              desc: "internal/utils is a leaf holding pure helpers, so it takes no internal dependency"
        domain:
          files:
            - "**/internal/domain/**"
            - "!$test"
          deny:
            - pkg: github.com/momobasehq/momobase/internal/service/audit
              desc: "internal/domain is a leaf holding the models and their behaviour, so it takes no internal dependency"
            - pkg: github.com/momobasehq/momobase/internal/utils
              desc: "internal/domain is a leaf holding the models and their behaviour, so it takes no internal dependency"
            - pkg: github.com/momobasehq/momobase/internal/service/provider
              desc: "internal/domain is a leaf holding the models and their behaviour, so it takes no internal dependency"
            - pkg: github.com/momobasehq/momobase/internal/service/routing
              desc: "internal/domain is a leaf holding the models and their behaviour, so it takes no internal dependency"
            - pkg: github.com/momobasehq/momobase/internal/service/payment
              desc: "internal/domain is a leaf holding the models and their behaviour, so it takes no internal dependency"
            - pkg: github.com/momobasehq/momobase/internal/service/webhook
              desc: "internal/domain is a leaf holding the models and their behaviour, so it takes no internal dependency"
            - pkg: github.com/momobasehq/momobase/internal/service/reconciliation
              desc: "internal/domain is a leaf holding the models and their behaviour, so it takes no internal dependency"
            - pkg: github.com/momobasehq/momobase/internal/service/identity
              desc: "internal/domain is a leaf holding the models and their behaviour, so it takes no internal dependency"
            - pkg: github.com/momobasehq/momobase/internal/http
              desc: "internal/domain is a leaf holding the models and their behaviour, so it takes no internal dependency"
            - pkg: github.com/momobasehq/momobase/internal/bootstrap
              desc: "internal/domain is a leaf holding the models and their behaviour, so it takes no internal dependency"
            - pkg: github.com/momobasehq/momobase/internal/workers
              desc: "internal/domain is a leaf holding the models and their behaviour, so it takes no internal dependency"
            - pkg: github.com/momobasehq/momobase/internal/platform
              desc: "internal/domain is a leaf holding the models and their behaviour, so it takes no internal dependency"
        audit:
          files:
            - "**/internal/service/audit/**"
            - "!$test"
          deny:
            - pkg: github.com/momobasehq/momobase/internal/service/provider
              desc: "internal/audit is a leaf recorder that must not know its callers"
            - pkg: github.com/momobasehq/momobase/internal/service/routing
              desc: "internal/audit is a leaf recorder that must not know its callers"
            - pkg: github.com/momobasehq/momobase/internal/service/payment
              desc: "internal/audit is a leaf recorder that must not know its callers"
            - pkg: github.com/momobasehq/momobase/internal/service/webhook
              desc: "internal/audit is a leaf recorder that must not know its callers"
            - pkg: github.com/momobasehq/momobase/internal/service/reconciliation
              desc: "internal/audit is a leaf recorder that must not know its callers"
            - pkg: github.com/momobasehq/momobase/internal/service/identity
              desc: "internal/audit is a leaf recorder that must not know its callers"
            - pkg: github.com/momobasehq/momobase/internal/http
              desc: "internal/audit is a leaf recorder that must not know its callers"
            - pkg: github.com/momobasehq/momobase/internal/bootstrap
              desc: "internal/audit is a leaf recorder that must not know its callers"
            - pkg: github.com/momobasehq/momobase/internal/workers
              desc: "internal/audit is a leaf recorder that must not know its callers"
        provider:
          files:
            - "**/internal/service/provider/**"
            - "!$test"
          deny:
            - pkg: github.com/momobasehq/momobase/internal/service/routing
              desc: "internal/provider owns the adapters; routing and the payment path build on it, never the reverse"
            - pkg: github.com/momobasehq/momobase/internal/service/payment
              desc: "internal/provider owns the adapters; routing and the payment path build on it, never the reverse"
            - pkg: github.com/momobasehq/momobase/internal/service/webhook
              desc: "internal/provider owns the adapters; routing and the payment path build on it, never the reverse"
            - pkg: github.com/momobasehq/momobase/internal/service/reconciliation
              desc: "internal/provider owns the adapters; routing and the payment path build on it, never the reverse"
            - pkg: github.com/momobasehq/momobase/internal/service/identity
              desc: "internal/provider owns the adapters; routing and the payment path build on it, never the reverse"
            - pkg: github.com/momobasehq/momobase/internal/http
              desc: "internal/provider owns the adapters; routing and the payment path build on it, never the reverse"
            - pkg: github.com/momobasehq/momobase/internal/bootstrap
              desc: "internal/provider owns the adapters; routing and the payment path build on it, never the reverse"
            - pkg: github.com/momobasehq/momobase/internal/workers
              desc: "internal/provider owns the adapters; routing and the payment path build on it, never the reverse"
        routing:
          files:
            - "**/internal/service/routing/**"
            - "!$test"
          deny:
            - pkg: github.com/momobasehq/momobase/internal/service/payment
              desc: "internal/routing selects a provider account; the payment path builds on it, never the reverse"
            - pkg: github.com/momobasehq/momobase/internal/service/webhook
              desc: "internal/routing selects a provider account; the payment path builds on it, never the reverse"
            - pkg: github.com/momobasehq/momobase/internal/service/reconciliation
              desc: "internal/routing selects a provider account; the payment path builds on it, never the reverse"
            - pkg: github.com/momobasehq/momobase/internal/service/identity
              desc: "internal/routing selects a provider account; the payment path builds on it, never the reverse"
            - pkg: github.com/momobasehq/momobase/internal/http
              desc: "internal/routing selects a provider account; the payment path builds on it, never the reverse"
            - pkg: github.com/momobasehq/momobase/internal/bootstrap
              desc: "internal/routing selects a provider account; the payment path builds on it, never the reverse"
            - pkg: github.com/momobasehq/momobase/internal/workers
              desc: "internal/routing selects a provider account; the payment path builds on it, never the reverse"
        payment:
          files:
            - "**/internal/service/payment/**"
            - "!$test"
          deny:
            - pkg: github.com/momobasehq/momobase/internal/service/webhook
              desc: "internal/payment is the request path; webhook and reconciliation are separate entry points"
            - pkg: github.com/momobasehq/momobase/internal/service/reconciliation
              desc: "internal/payment is the request path; webhook and reconciliation are separate entry points"
            - pkg: github.com/momobasehq/momobase/internal/service/identity
              desc: "internal/payment is the request path; webhook and reconciliation are separate entry points"
            - pkg: github.com/momobasehq/momobase/internal/http
              desc: "internal/payment is the request path; webhook and reconciliation are separate entry points"
            - pkg: github.com/momobasehq/momobase/internal/bootstrap
              desc: "internal/payment is the request path; webhook and reconciliation are separate entry points"
            - pkg: github.com/momobasehq/momobase/internal/workers
              desc: "internal/payment is the request path; webhook and reconciliation are separate entry points"
        webhook:
          files:
            - "**/internal/service/webhook/**"
            - "!$test"
          deny:
            - pkg: github.com/momobasehq/momobase/internal/service/routing
              desc: "internal/webhook applies provider callbacks and must not reach into the request path"
            - pkg: github.com/momobasehq/momobase/internal/service/payment
              desc: "internal/webhook applies provider callbacks and must not reach into the request path"
            - pkg: github.com/momobasehq/momobase/internal/service/reconciliation
              desc: "internal/webhook applies provider callbacks and must not reach into the request path"
            - pkg: github.com/momobasehq/momobase/internal/service/identity
              desc: "internal/webhook applies provider callbacks and must not reach into the request path"
            - pkg: github.com/momobasehq/momobase/internal/http
              desc: "internal/webhook applies provider callbacks and must not reach into the request path"
            - pkg: github.com/momobasehq/momobase/internal/bootstrap
              desc: "internal/webhook applies provider callbacks and must not reach into the request path"
            - pkg: github.com/momobasehq/momobase/internal/workers
              desc: "internal/webhook applies provider callbacks and must not reach into the request path"
        reconciliation:
          files:
            - "**/internal/service/reconciliation/**"
            - "!$test"
          deny:
            - pkg: github.com/momobasehq/momobase/internal/service/routing
              desc: "internal/reconciliation is the settle path and must not reach into the request path"
            - pkg: github.com/momobasehq/momobase/internal/service/payment
              desc: "internal/reconciliation is the settle path and must not reach into the request path"
            - pkg: github.com/momobasehq/momobase/internal/service/identity
              desc: "internal/reconciliation is the settle path and must not reach into the request path"
            - pkg: github.com/momobasehq/momobase/internal/http
              desc: "internal/reconciliation is the settle path and must not reach into the request path"
            - pkg: github.com/momobasehq/momobase/internal/bootstrap
              desc: "internal/reconciliation is the settle path and must not reach into the request path"
            - pkg: github.com/momobasehq/momobase/internal/workers
              desc: "internal/reconciliation is the settle path and must not reach into the request path"
        services:
          files:
            - "**/internal/service/identity/**"
            - "!$test"
          deny:
            - pkg: github.com/momobasehq/momobase/internal/service/provider
              desc: "internal/services is identity and tenancy, and must not depend on the payment packages"
            - pkg: github.com/momobasehq/momobase/internal/service/routing
              desc: "internal/services is identity and tenancy, and must not depend on the payment packages"
            - pkg: github.com/momobasehq/momobase/internal/service/payment
              desc: "internal/services is identity and tenancy, and must not depend on the payment packages"
            - pkg: github.com/momobasehq/momobase/internal/service/webhook
              desc: "internal/services is identity and tenancy, and must not depend on the payment packages"
            - pkg: github.com/momobasehq/momobase/internal/service/reconciliation
              desc: "internal/services is identity and tenancy, and must not depend on the payment packages"
            - pkg: github.com/momobasehq/momobase/internal/http
              desc: "internal/services is identity and tenancy, and must not depend on the payment packages"
            - pkg: github.com/momobasehq/momobase/internal/bootstrap
              desc: "internal/services is identity and tenancy, and must not depend on the payment packages"
            - pkg: github.com/momobasehq/momobase/internal/workers
              desc: "internal/services is identity and tenancy, and must not depend on the payment packages"
  exclusions:
    generated: strict

formatters:
  enable:
    - gofmt
    - goimports
    - golines
  settings:
    golines:
      max-len: 160
      tab-len: 8
      shorten-comments: false
      reformat-tags: false
  exclusions:
    generated: strict
