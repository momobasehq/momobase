<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Momobase">
  <title>Momobase</title>
  <!--
    The M is a single stroke whose peaks rise off a solid base bar: separate rails
    converging on one platform. Round joins and caps let the descenders merge into
    the bar rather than sit on top of it, so the mark reads as one closed form.
    Geometry is stroke-only at a 4-unit weight, which stays legible down to 16px.
  -->
  <style>
    :root { --logo-ink: #0b0b0b; }
    @media (prefers-color-scheme: dark) { :root { --logo-ink: #ffffff; } }
  </style>
  <g fill="none" stroke="var(--logo-ink, #0b0b0b)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 21 L11 7 L16 15 L21 7 L26 21" />
    <path d="M6 25 H26" />
  </g>
</svg>
