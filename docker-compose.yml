services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-momobase}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-momobase}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-momobase} -d ${DB_NAME:-momobase}"]
      interval: 10s
      timeout: 5s
      retries: 5

  momobase:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_NAME: ${APP_NAME:-momobase}
      APP_ENV: ${APP_ENV:-staging}
      APP_ADDR: :8080
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?set APP_PUBLIC_URL, e.g. https://payments.example.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://payments.example.com}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-false}
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-momobase}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-momobase}
      DB_SSLMODE: disable
      ENCRYPTION_MASTER_KEY_BASE64: ${ENCRYPTION_MASTER_KEY_BASE64:?set ENCRYPTION_MASTER_KEY_BASE64, e.g. openssl rand -base64 32}
      ADMIN_OAUTH_SECRET: ${ADMIN_OAUTH_SECRET:?set ADMIN_OAUTH_SECRET at least 32 chars}
      APP_OAUTH_SECRET: ${APP_OAUTH_SECRET:?set APP_OAUTH_SECRET at least 32 chars}
      ADMIN_ACCESS_TTL_MINUTES: ${ADMIN_ACCESS_TTL_MINUTES:-15}
      ADMIN_REFRESH_TTL_HOURS: ${ADMIN_REFRESH_TTL_HOURS:-24}
      APP_ACCESS_TTL_MINUTES: ${APP_ACCESS_TTL_MINUTES:-30}
      APP_CLIENT_ID_PREFIX: ${APP_CLIENT_ID_PREFIX:-app_client}
      APP_CLIENT_SECRET_PREFIX: ${APP_CLIENT_SECRET_PREFIX:-mb_live}
      WORKERS_ENABLED: ${WORKERS_ENABLED:-true}
      HEALTH_WORKER_ENABLED: ${HEALTH_WORKER_ENABLED:-true}
      HEALTH_CHECK_INTERVAL_SECONDS: ${HEALTH_CHECK_INTERVAL_SECONDS:-30}
      RECONCILIATION_WORKER_ENABLED: ${RECONCILIATION_WORKER_ENABLED:-true}
      RECONCILIATION_INTERVAL_SECONDS: ${RECONCILIATION_INTERVAL_SECONDS:-60}
      CLEANUP_WORKER_ENABLED: ${CLEANUP_WORKER_ENABLED:-true}
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-300}
      ADMIN_FRONTEND_ENABLED: ${ADMIN_FRONTEND_ENABLED:-true}

volumes:
  postgres_data:
