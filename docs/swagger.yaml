          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List application credentials
      tags:
      - Admin - Credentials
    post:
      consumes:
      - application/json
      description: Returns the client secret once. Store it securely because it cannot
        be retrieved later.
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: string
      - description: Credential
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apidoc.CreateCredentialRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
