          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an application credential
      tags:
      - Admin - Credentials
  /api/admin/apps/{id}/credentials/{credentialID}/revoke:
    patch:
      parameters:
