basePath: /
definitions:
  admin.RoleRequest:
    properties:
      description:
        description: Description explains the role in an operator-facing list.
        example: Read transactions and reissue credentials
        type: string
      name:
        description: Name identifies the role. It is ignored when updating, since
          the path carries it.
        example: support
        type: string
      permissions:
        description: Permissions are the codes the role grants, from GET /api/admin/permissions.
        example:
        - transactions:read
        - credentials:update
        items:
          type: string
        type: array
    type: object
  apidoc.ChangePasswordRequest:
    properties:
      password:
        example: change-me-now
        format: password
        type: string
    type: object
  apidoc.ChangeStatusRequest:
    properties:
      status:
        example: active
        type: string
    type: object
  apidoc.CreateAdminRequest:
    properties:
      email:
        example: ops@example.com
        format: email
        type: string
      name:
        example: Operations Admin
        type: string
      password:
        example: change-me-now
        format: password
        type: string
      role:
        description: Role names a seeded or operator-created role; list them with
          GET /api/admin/roles.
        example: operations
        type: string
    type: object
  apidoc.CreateAppRequest:
    properties:
      description:
        example: Checkout payment application
        type: string
      environment:
        enum:
        - sandbox
        - production
        example: sandbox
        type: string
      name:
        example: Checkout
        type: string
    type: object
  apidoc.CreateCredentialRequest:
    properties:
      expires_at:
        example: "2030-01-02T03:04:05Z"
        format: date-time
        type: string
      name:
        example: Backend credential
        type: string
      scopes:
        example: collections:create transactions:read
        type: string
    type: object
  apidoc.CreateProviderAccountRequest:
    properties:
      config:
        type: object
      countries:
        description: |-
          Countries restricts the account to the listed ISO 3166-1 alpha-2 countries. An
          empty list leaves it unrestricted, which suits a rail with no country notion.
        example:
        - UG
        items:
          type: string
        type: array
      environment:
        enum:
        - sandbox
        - production
        example: sandbox
        type: string
      name:
        example: Sandbox provider
        type: string
      provider_code:
        example: dummy
        type: string
    type: object
  apidoc.CreateRouteRequest:
    properties:
      active:
        example: true
        type: boolean
      payment_method:
        example: momo
        type: string
      priority:
        example: 1
        minimum: 1
        type: integer
      provider_account_id:
        example: pacc_123
        type: string
      service_type:
        enum:
        - collection
        - disbursement
        example: collection
        type: string
    type: object
  apidoc.DocResponse:
    properties:
      data: {}
      error:
        $ref: '#/definitions/platform.APIError'
      message:
        type: string
      success:
        example: true
        type: boolean
    type: object
  apidoc.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/platform.APIError'
      message:
        example: request failed
        type: string
      success:
        example: false
        type: boolean
    type: object
  apidoc.ProviderRegistry:
    properties:
      providers:
        example:
        - dummy
        items:
          type: string
        type: array
    type: object
  apidoc.ProviderRegistryResponse:
    properties:
      data:
        $ref: '#/definitions/apidoc.ProviderRegistry'
      error:
        $ref: '#/definitions/platform.APIError'
      message:
        type: string
      success:
        example: true
        type: boolean
    type: object
  apidoc.SystemHealth:
    properties:
      active_provider_account_count:
        example: 2
        type: integer
      database:
        enum:
        - ok
        - error
        example: ok
        type: string
      ok:
        example: true
        type: boolean
      runtime_provider_count:
        example: 2
        type: integer
      server_time:
        type: string
      workers_configured:
        example:
        - health
        - reconciliation
        items:
          type: string
        type: array
    type: object
  apidoc.SystemInfo:
    properties:
      addr:
        example: :9090
        type: string
      app_env:
        example: production
        type: string
      app_name:
        example: momobase
        type: string
      db_type:
        example: postgres
        type: string
      go_version:
        example: go1.23.0
        type: string
      server_time:
        type: string
      worker_names:
        example:
        - health
        - reconciliation
        items:
          type: string
        type: array
      workers_enabled:
        example: true
        type: boolean
    type: object
  apidoc.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  apidoc.UpdateAppRequest:
    properties:
      description:
        example: Checkout payment application
        type: string
      environment:
        enum:
        - sandbox
        - production
        example: sandbox
        type: string
      name:
        example: Checkout
        type: string
    type: object
  apidoc.UpdateCountriesRequest:
    properties:
      countries:
        example:
        - UG
        - RW
        items:
          type: string
        type: array
    type: object
  apidoc.UpdateProviderConfigRequest:
    properties:
      config:
        type: object
    type: object
  apidoc.UpdateRouteRequest:
    properties:
      active:
        example: true
        type: boolean
      priority:
        example: 1
        minimum: 1
        type: integer
    type: object
  platform.APIError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  services.CreatePaymentRequest:
    properties:
      account:
        description: |-
          Account is the provider-specific account the payment is collected from or
          disbursed to: a mobile number, bank account, card token, or wallet address.
          Momobase treats it as opaque and leaves its validation to the selected
          provider, through providers.RequestValidator.
        type: string
      amount:
        description: Amount is the payment amount in the currency's minor unit.
        type: integer
      country:
        description: |-
          Country is the optional ISO 3166-1 alpha-2 transaction country. Providers that
          declare supported countries are only eligible when it is present and matches.
        type: string
      currency:
        description: Currency is the three-letter currency code.
        type: string
      customer:
        allOf:
        - $ref: '#/definitions/services.PartyPayload'
        description: Customer optionally identifies the collection customer.
      description:
        description: Description is optional payment context shown to downstream systems.
        type: string
      metadata:
        additionalProperties: {}
        description: |-
          Metadata optionally carries provider-specific payment details, such as a bank
          branch code. It reaches the selected provider and is never persisted, so it
          cannot become a free-form store of identifiers Momobase would then have to
          protect. It is part of the idempotency hash.
        type: object
      payment_method:
        description: |-
          PaymentMethod identifies the requested payment rail. It is free-form and must
          match an active payment route.
        type: string
      recipient:
        allOf:
        - $ref: '#/definitions/services.PartyPayload'
        description: Recipient optionally identifies the disbursement recipient.
      reference:
        description: Reference is the application's unique business reference.
        type: string
      scheme:
        description: |-
          Scheme optionally names the account's provider-specific scheme, such as a
          mobile network, bank, or card brand. Like PaymentMethod it is free-form; the
          selected provider interprets it and Momobase never matches on it.
        type: string
    type: object
  services.PartyPayload:
    properties:
      email:
        description: Email is the party's email address.
        type: string
      name:
        description: Name is the party's display name.
        type: string
    type: object
info:
  contact: {}
  description: Payment orchestration API for application payments and administrative
    operations.
  title: Momobase API
  version: "1.0"
paths:
  /api/admin/apps:
    get:
      parameters:
      - description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apidoc.DocResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List applications
      tags:
      - Admin - Applications
    post:
      consumes:
      - application/json
      parameters:
      - description: Application
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apidoc.CreateAppRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/apidoc.DocResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an application
      tags:
      - Admin - Applications
  /api/admin/apps/{id}:
