      summary: Get an application
      tags:
      - Admin - Applications
    patch:
      consumes:
      - application/json
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: string
      - description: Application changes
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apidoc.UpdateAppRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apidoc.DocResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update an application
      tags:
      - Admin - Applications
  /api/admin/apps/{id}/credentials:
    get:
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: string
      - description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apidoc.DocResponse'
        "401":
          description: Unauthorized
          schema:
