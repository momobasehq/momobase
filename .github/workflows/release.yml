name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      snapshot:
        description: Build artifacts without publishing a release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build binaries and publish images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          # GoReleaser derives the version and changelog from tags and history.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify the tagged commit
        run: |
          go vet ./...
          go test ./...

      # Momobase links SQLite through cgo, so arm64 needs a cross toolchain.
      - name: Install the arm64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: >-
            ${{ (github.event_name == 'workflow_dispatch' && inputs.snapshot)
                && 'release --clean --snapshot'
                || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Each binary is statically linked, so it must run on a host with no glibc
      # at all; Alpine proves that and QEMU covers the arm64 leg. Running
      # migrate rather than version is deliberate: a binary accidentally built
      # without cgo still prints its version, and only fails once it opens
      # SQLite, which is the default DB_TYPE.
      - name: Smoke test the released binaries
        env:
          SMOKE_SECRET: release-smoke-secret-0123456789abcdef
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            # The dist directory carries a GOAMD64/GOARM64 variant suffix that
            # changes between GoReleaser versions, so match on the prefix.
            binary="$(find dist -type f -name momobase -path "*_linux_${arch}*" | head -n 1)"
            if [[ -z "${binary}" ]]; then
              echo "no linux/${arch} binary in dist" >&2
              exit 1
            fi
            echo "--- linux/${arch}: ${binary}"
            file "${binary}" | grep --fixed-strings 'statically linked'
            docker run --rm --platform "linux/${arch}" \
              --volume "${PWD}/dist:/dist:ro" \
              --env DB_TYPE=sqlite \
              --env DB_PATH=/tmp/smoke/momobase.db \
              --env ADMIN_OAUTH_SECRET="${SMOKE_SECRET}" \
              --env APP_OAUTH_SECRET="${SMOKE_SECRET}" \
              --env WORKERS_ENABLED=false \
              alpine:3 "/${binary}" version
            docker run --rm --platform "linux/${arch}" \
              --volume "${PWD}/dist:/dist:ro" \
              --env DB_TYPE=sqlite \
              --env DB_PATH=/tmp/smoke/momobase.db \
              --env ADMIN_OAUTH_SECRET="${SMOKE_SECRET}" \
              --env APP_OAUTH_SECRET="${SMOKE_SECRET}" \
              --env WORKERS_ENABLED=false \
              alpine:3 "/${binary}" migrate | grep --fixed-strings 'migrations applied'
          done

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: momobase-dist
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: warn
          retention-days: 14
