name: Publish Momobase

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  release:
    name: Publish Go package
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Update changelog
        run: npx --yes auto-changelog@latest --output CHANGELOG.md --tag-pattern "v.*"

      - name: Commit and push changelog
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(root): update changelog for ${{ github.ref_name }}"
          file_pattern: CHANGELOG.md
          branch: main

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true

      - name: Publish module
        run: GOPROXY=https://proxy.golang.org go list -m github.com/momobasehq/momobase@${{ github.ref_name }}
