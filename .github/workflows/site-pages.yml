name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/site-pages.yml
      - web/site/**
      - web/package.json
      - web/pnpm-lock.yaml
      - web/pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build and upload Pages artifact
        uses: withastro/action@v6
        with:
          path: web/site
          node-version: 24
          package-manager: pnpm@11

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
