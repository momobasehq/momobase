name: Go Tests

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, dependencies, tests, race, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.2.0
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v6.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build dashboard bundle
        run: make dashboard

      - name: Verify dashboard bundle is current
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- web/dashboard/dist)" ]]; then
            git status --short -- web/dashboard/dist
            exit 1
          fi

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [[ -n "${unformatted}" ]]; then
            echo "The following files are not formatted:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Verify module files are tidy
        run: go mod tidy -diff

      - name: Verify downloaded modules
        run: go mod verify

      - name: Run tests with coverage
        run: go test -shuffle=on -covermode=atomic -coverprofile=coverage.out -coverpkg=./... ./...

      - name: Report coverage
        env:
          MINIMUM_COVERAGE: "55.0"
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          total="$(awk '/^total:/ {gsub(/%/, "", $3); print $3}' coverage.txt)"
          awk -v total="${total}" -v minimum="${MINIMUM_COVERAGE}" 'BEGIN {
            if (total + 0 < minimum + 0) {
              printf "Total coverage %.1f%% is below the %.1f%% minimum.\n", total, minimum
              exit 1
            }
          }'

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage.txt
          if-no-files-found: error
          retention-days: 14

      - name: Run race detector
        run: go test -race ./...

      - name: Run GolangCI-Lint
        uses: golangci/golangci-lint-action@v9.0.0
        with:
          version-file: .golangci-lint-version
