name: Go CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, dependencies, vet, test, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [[ -n "${unformatted}" ]]; then
            echo "The following files are not formatted:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Verify module files are tidy
        run: go mod tidy -diff

      - name: Verify downloaded modules
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with coverage
        run: go test -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...

      - name: Report coverage
        env:
          MINIMUM_COVERAGE: "50.0"
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          total="$(awk '/^total:/ {gsub(/%/, "", $3); print $3}' coverage.txt)"
          awk -v total="${total}" -v minimum="${MINIMUM_COVERAGE}" 'BEGIN {
            if (total + 0 < minimum + 0) {
              printf "Total coverage %.1f%% is below the %.1f%% minimum.\n", total, minimum
              exit 1
            }
          }'

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage.txt
          if-no-files-found: error
          retention-days: 14

  race:
    name: Race detector
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run race detector
        run: go test -race ./...

  golangci-lint:
    name: GolangCI-Lint
    needs: race
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run GolangCI-Lint
        uses: golangci/golangci-lint-action@v9.0.0
        with:
          version-file: .golangci-lint-version

  staticcheck:
    name: Staticcheck
    needs: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Run Staticcheck
        uses: dominikh/staticcheck-action@v1.4.1
        with:
          version: "2026.1"
          cache-key: staticcheck-2026.1

  docker:
    name: Build and smoke test Docker image
    needs: staticcheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_IMAGE: momobase:ci
      TEST_CONTAINER: momobase-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha,scope=momobase-ci
          cache-to: type=gha,mode=max,scope=momobase-ci

      - name: Smoke test with SQLite
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            result=$?
            if [[ ${result} -ne 0 ]]; then
              docker logs "${TEST_CONTAINER}" || true
            fi
            docker rm --force "${TEST_CONTAINER}" >/dev/null 2>&1 || true
            trap - EXIT
            exit "${result}"
          }
          trap cleanup EXIT

          docker run --detach \
            --name "${TEST_CONTAINER}" \
            --publish 127.0.0.1:19090:9090 \
            --env APP_ENV=staging \
            --env APP_ADDR=:9090 \
            --env APP_PUBLIC_URL=https://momobase.test \
            --env CORS_ALLOWED_ORIGINS=https://momobase.test \
            --env AUTO_MIGRATE=true \
            --env DB_TYPE=sqlite \
            --env DB_PATH=/app/data/momobase-ci.db \
            --env ENCRYPTION_MASTER_KEY_BASE64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= \
            --env ADMIN_OAUTH_SECRET=ci-admin-oauth-secret-0123456789abcdef \
            --env APP_OAUTH_SECRET=ci-application-oauth-secret-0123456789abcdef \
            --env WORKERS_ENABLED=false \
            --env ADMIN_FRONTEND_ENABLED=true \
            "${TEST_IMAGE}"

          curl --fail --silent --show-error \
            --retry 30 \
            --retry-delay 1 \
            --retry-connrefused \
            http://127.0.0.1:19090/healthz
          curl --fail --silent --show-error http://127.0.0.1:19090/admin/ \
            | grep --fixed-strings '<title>Momobase Admin</title>'
          curl --fail --silent --show-error http://127.0.0.1:19090/admin/app.js \
            | grep --fixed-strings 'window.adminApp'
